name: Build

# Every push and pull request builds the exe and keeps it as a workflow artifact.
# Pushing a tag like v1.2.0 also publishes a GitHub Release with the exe and its SHA-256.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $v = $Matches[1]
          } else {
            $v = '0.0.0'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build TempMonitor.csproj -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/Release/net48/TempMonitor.exe dist/
          $hash = (Get-FileHash dist/TempMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TempMonitor.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TempMonitor
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/TempMonitor.exe dist/SHA256SUMS.txt --title "Temp Monitor ${{ github.ref_name }}" --generate-notes
