name: Build

# Every push and pull request builds the exe and keeps it as a workflow artifact.
# Pushing a tag like v1.2.0 also publishes a GitHub Release with the exe and its SHA-256
# (or attaches them to that tag's release if one was already created on GitHub).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $v = $Matches[1]
          } else {
            $v = '0.0.0'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build TempMonitor.csproj -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin/Release/net48/TempMonitor.exe dist/
          $hash = (Get-FileHash dist/TempMonitor.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TempMonitor.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: TempMonitor
          path: dist/

      # Attaches the files to the tag's release, creating the release if it doesn't exist yet
      # (it may already exist if it was drafted on GitHub before the tag was pushed).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/TempMonitor.exe dist/SHA256SUMS.txt --clobber
          } else {
            # A short description for people (and search engines) landing on the release page.
            # GitHub puts the generated changelog after it.
            $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            @(
              'Temp Monitor is a free, portable app that shows live CPU, GPU, SSD, motherboard and RAM temperatures on Windows 10 and 11.'
              ''
              '**Download `TempMonitor.exe` below and run it.** There is nothing to install. Click **Yes** when Windows asks for administrator permission; first-run steps are in the [README](https://github.com/' + $env:GITHUB_REPOSITORY + '#first-run).'
              ''
            ) | Set-Content -Encoding utf8 $notes
            gh release create $env:TAG dist/TempMonitor.exe dist/SHA256SUMS.txt --title "Temp Monitor $env:TAG" --notes-file $notes --generate-notes
          }
          exit $LASTEXITCODE
